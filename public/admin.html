<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141110">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍔</text></svg>">
<title>Admin – SM i Hamburgare</title>
<style>
  /* Space Grotesk self-hostad (public/fonts/, OFL-licens) — inga externa beroenden
     på tävlingsdagen; arenanätet behöver bara nå vår egen worker. */
  @font-face {
    font-family: "Space Grotesk";
    src: url("/fonts/space-grotesk.woff2") format("woff2");
    font-weight: 300 700;
    font-style: normal;
    font-display: swap;
  }
  :root {
    --bg:#141110; --panel:#1C1713; --panel2:#241E18; --line:#2A231C; --line2:#352C22;
    --ink:#F2EAD9; --muted:#A08A6A; --dim:#7A6A55; --faint:#5C4F3E;
    --amber:#FFB03A; --amber-ink:#1A140D;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.45; font-size: 15px; }
  ::selection { background: rgba(255,176,58,.35); }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 14px 16px 80px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 2px 12px; border-bottom: 1px solid var(--line); }
  header .brand { display: flex; align-items: center; gap: 12px; }
  header img.logo { width: 36px; height: auto; }
  header .kicker { font-size: .6rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  header h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em; }
  header button.sec { background: transparent; border: 1px solid var(--line2); color: var(--muted); }
  @media (min-width: 900px) {
    header { padding: 16px 2px 18px; }
    header .brand { gap: 16px; }
    header img.logo { width: 56px; }
    header .kicker { font-size: .66rem; letter-spacing: .22em; }
    header h1 { font-size: 1.5rem; }
  }
  nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0; }
  nav button { padding: 7px 13px; border: 1px solid var(--line2); background: transparent; border-radius: 99px; font-size: .84rem; font-weight: 500; color: #CBBBA0; cursor: pointer; font-family: inherit; transition: border-color .12s ease, color .12s ease; }
  nav button:hover { border-color: var(--dim); color: var(--ink); }
  nav button.active { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); font-weight: 700; }
  .card { background: var(--panel); border-radius: 14px; padding: 16px 18px; margin-top: 12px; }
  h2 { font-size: .74rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th { text-align: left; font-size: .64rem; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; font-weight: 600; }
  td { padding: 8px 6px; border-bottom: 1px solid var(--panel2); vertical-align: top; }
  tr:hover > td { background: #201A15; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  input, select, textarea { padding: 9px 11px; border: 1px solid #3A3128; border-radius: 9px; font-size: .95rem; background: #1F1A15; color: var(--ink); font-family: inherit; }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  select option { background: #1F1A15; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 3px solid rgba(255,176,58,.4); outline-offset: 1px; }
  textarea { width: 100%; min-height: 110px; }
  button.act { padding: 9px 16px; border: 0; border-radius: 9px; background: var(--amber); color: var(--amber-ink); font-weight: 700; cursor: pointer; font-size: .9rem; font-family: inherit; }
  button.act:active { transform: scale(.97); }
  button.sec { padding: 8px 13px; border: 1px solid var(--line2); border-radius: 9px; background: transparent; color: #CBBBA0; cursor: pointer; font-size: .85rem; font-family: inherit; }
  button.sec:hover { border-color: var(--dim); color: var(--ink); }
  button.danger { border-color: #5C3A28; color: #F0B9A2; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
  .statgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 14px; }
  @media (max-width: 700px) { .statgrid { grid-template-columns: repeat(2, 1fr); } }
  .stat { background: var(--panel); border-radius: 14px; padding: 14px 18px; }
  .stat b { font-size: 2.1rem; font-weight: 700; color: var(--amber); display: block; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .stat span { font-size: .66rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .dash { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; align-items: start; }
  @media (max-width: 900px) { .dash { grid-template-columns: 1fr; } }
  .msg { margin-top: 10px; padding: 10px 12px; border-radius: 9px; display: none; font-size: .9rem; }
  .msg.err { background: #2E1B12; color: #F0B9A2; border: 1px solid #5C3A28; display: block; }
  .msg.ok { background: #16281F; color: #A8D8C0; border: 1px solid #2E4A3A; display: block; }
  .badge { display: inline-block; font-size: .66rem; border: 1px solid rgba(255,176,58,.5); color: var(--amber); border-radius: 99px; padding: 1px 8px; margin-left: 5px; font-weight: 500; }
  .warn { color: #F0B9A2; font-weight: 700; }
  .chip { display: inline-block; border: 1px dashed var(--amber); color: var(--amber); border-radius: 99px; padding: 4px 12px; margin: 0 5px 5px 0; cursor: pointer; font-size: .82rem; font-weight: 600; background: transparent; }
  .chip:hover { background: rgba(255,176,58,.12); }
  .bar { display: inline-block; width: 56px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; vertical-align: 2px; margin-right: 8px; }
  .bar i { display: block; height: 100%; background: var(--amber); }
  .btns { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; max-width: 460px; }
  .btns button { padding: 10px 0; border: 1px solid var(--line2); background: var(--panel2); border-radius: 7px; cursor: pointer; font-family: inherit; font-weight: 500; color: #CBBBA0; }
  .btns button.sel { background: var(--amber); border-color: var(--amber); color: var(--amber-ink); font-weight: 700; }
  .muted { color: var(--dim); font-size: .82rem; }
  .live { font-size: .72rem; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .live i { display: inline-block; width: 7px; height: 7px; border-radius: 99px; background: #5CBF8A; margin-right: 6px; animation: livepuls 2.4s ease-in-out infinite; }
  .live.err { color: #F0B9A2; }
  .live.err i { background: #FF8A5C; animation: none; }
  @keyframes livepuls { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .live i { animation: none; } }
  .login { max-width: 400px; margin: 10vh auto 0; text-align: center; background: var(--panel); border: 1px solid rgba(255,176,58,.3); border-radius: 20px; padding: 30px 26px 26px; }
  .login img.logo { width: 96px; margin-bottom: 14px; }
  .login h2 { color: var(--ink); font-size: 1.15rem; letter-spacing: -.01em; text-transform: none; }
  .login .muted { color: var(--muted); }
  .login input { width: 100%; margin: 14px 0 12px; padding: 12px; text-align: center; }
  .login button.act { width: 100%; padding: 12px; }
  .sev-neg { color: #FF8A5C; font-weight: 700; } .sev-pos { color: #6FD3C7; font-weight: 700; }
  .combo { position: relative; display: inline-block; }
  .combo input.combo-q { width: 100%; }
  .combo-list {
    position: absolute; z-index: 30; top: calc(100% + 4px); left: 0;
    min-width: 100%; width: max-content; max-width: 460px;
    max-height: 260px; overflow-y: auto; background: #1F1A15; border: 1px solid var(--line2);
    border-radius: 10px; box-shadow: 0 14px 34px rgba(0,0,0,.55); padding: 4px;
  }
  .combo-list div[data-v] { padding: 7px 10px; border-radius: 7px; cursor: pointer; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .combo-list div[data-v]:hover, .combo-list div[data-v].on { background: var(--panel2); color: var(--ink); }
  .combo-list div[data-v].cur { color: var(--amber); font-weight: 600; }
  .combo-list .none { padding: 8px 10px; color: var(--dim); font-size: .85rem; }
  .legrow { display: flex; align-items: baseline; gap: 8px; }
  .legrow .legname { color: var(--dim); font-size: .78rem; }
  .edited { font-size: .66rem; color: var(--amber); border: 1px solid rgba(255,176,58,.4); border-radius: 99px; padding: 0 7px; margin-left: 5px; }
  tr.editing > td { background: #211A14; }
  #rkTable { overflow-x: auto; }
  #rkTable .msg { margin-top: 12px; }
  @keyframes sparad { from { background: rgba(255,176,58,.28); } to { background: transparent; } }
  tr.saved > td { animation: sparad 1.8s ease-out; }
  @media (prefers-reduced-motion: reduce) { tr.saved > td { animation: none; background: #211A14; } }
  .scoreset { display: inline-flex; gap: 10px; flex-wrap: wrap; }
  .scoreset b { font-weight: 600; color: var(--muted); font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; }
  /* Reservplats för meddelanden vars vanliga ruta hamnat utanför skärmen. */
  #toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 100;
    max-width: min(620px, calc(100vw - 32px)); padding: 12px 16px; border-radius: 10px;
    font-size: .92rem; box-shadow: 0 16px 40px rgba(0,0,0,.6); cursor: pointer; display: none;
  }
  #toast.err { background: #2E1B12; color: #F0B9A2; border: 1px solid #5C3A28; display: block; }
  #toast.ok { background: #16281F; color: #A8D8C0; border: 1px solid #2E4A3A; display: block; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
"use strict";
var app = document.getElementById("app");
var token = sessionStorage.getItem("adminToken") || "";
var startHash = location.hash.replace("#", "");
var currentView = (startHash.split("?")[0] || "oversikt");
var currentQuery = startHash.indexOf("?") >= 0 ? startHash.slice(startHash.indexOf("?") + 1) : "";
var renderedHash = null;
var refreshTimer = null;
var cache = { config: null };

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
  });
}
var fmt2 = new Intl.NumberFormat("sv-SE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

var TIDFMT = new Intl.DateTimeFormat("sv-SE", {
  timeZone: "Europe/Stockholm",
  year: "numeric", month: "2-digit", day: "2-digit",
  hour: "2-digit", minute: "2-digit", second: "2-digit",
  hourCycle: "h23",
});

/**
 * D1-tidsstämplar är UTC ("YYYY-MM-DD HH:MM:SS") — allt som visas formateras i
 * svensk tid (Europe/Stockholm). del: "hms" 14:30:15 · "dhm" 08-16 14:30 ·
 * "dhms" 08-16 14:30:15 · "lang" 2026-08-16 14:30 · annars hela stämpeln.
 */
function svTid(utc, del) {
  if (!utc) return "";
  var d = new Date(String(utc).replace(" ", "T") + "Z");
  if (isNaN(d.getTime())) return String(utc);
  var p = {};
  TIDFMT.formatToParts(d).forEach(function (x) { p[x.type] = x.value; });
  var s = p.year + "-" + p.month + "-" + p.day + " " + p.hour + ":" + p.minute + ":" + p.second;
  if (del === "hms") return s.slice(11, 19);
  if (del === "dhm") return s.slice(5, 16);
  if (del === "dhms") return s.slice(5, 19);
  if (del === "lang") return s.slice(0, 16);
  return s;
}

function api(path, opts) {
  opts = opts || {};
  var headers = { authorization: "Bearer " + token };
  if (opts.body && typeof opts.body !== "string") {
    headers["content-type"] = "application/json";
    opts = Object.assign({}, opts, { body: JSON.stringify(opts.body) });
  }
  opts.headers = Object.assign(headers, opts.headers || {});
  return fetch("/api" + path, opts).then(function (res) {
    if (res.status === 401) { showLogin(); throw new Error("unauthorized"); }
    var ct = res.headers.get("content-type") || "";
    return (ct.indexOf("json") >= 0 ? res.json() : res.text()).then(function (data) {
      return { status: res.status, data: data };
    });
  });
}

var toast = document.getElementById("toast");
var toastTimer = null;
toast.addEventListener("click", function () { toast.className = ""; });

function showToast(kind, text) {
  toast.className = kind;
  toast.textContent = text;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toast.className = ""; }, kind === "ok" ? 4000 : 9000);
}

/** Kvittens på något som ritar om vyn — notisen ligger utanför #app och överlever. */
function flash(kind, text) {
  showToast(kind, text);
}

function inView(el) {
  var r = el.getBoundingClientRect();
  if (r.width === 0 && r.height === 0) return false;
  return r.bottom > 0 && r.top < (window.innerHeight || document.documentElement.clientHeight);
}

/**
 * Skriver meddelandet i vyns egen ruta. Ligger den utanför skärmen — långa listor gör
 * det lätt hänt — visas samma text som en notis längst ner, så svaret aldrig missas.
 */
function msg(id, kind, text) {
  var el = document.getElementById(id);
  if (!el) { showToast(kind, text); return; }
  el.className = "msg " + kind;
  el.textContent = text;
  if (!inView(el)) showToast(kind, text);
  else toast.className = "";
  if (kind === "ok") setTimeout(function () { if (el.className.indexOf("ok") >= 0) { el.className = "msg"; } }, 4000);
}

// ---------- Sökbar dropdown ----------
// Med ~30 lag blir vanliga select-listor för långsamma att bläddra i, särskilt
// listorna med lag × gren. comboHtml() lägger ut fältet, comboInit() kopplar på
// sökningen och det valda värdet hamnar i ett dolt fält med samma id.
var COMBOS = {};

function comboHtml(id, placeholder, width) {
  return '<span class="combo" style="width:' + (width || 240) + 'px">' +
    '<input type="hidden" id="' + id + '">' +
    '<input type="text" class="combo-q" id="' + id + '-q" placeholder="' + esc(placeholder) + '" autocomplete="off" ' +
    'role="combobox" aria-autocomplete="list" aria-expanded="false">' +
    '<div class="combo-list" id="' + id + '-list" role="listbox" style="display:none"></div></span>';
}

function comboInit(id, options, onChange) {
  var hidden = document.getElementById(id);
  var q = document.getElementById(id + "-q");
  var list = document.getElementById(id + "-list");
  if (!hidden || !q || !list) return;
  var st = { options: options, shown: [], active: -1, open: false };
  COMBOS[id] = st;

  function labelFor(value) {
    for (var i = 0; i < options.length; i++) {
      if (String(options[i].value) === String(value)) return options[i].label;
    }
    return "";
  }
  function filter(text) {
    var terms = String(text || "").toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) return options.slice();
    return options.filter(function (o) {
      var hay = o.label.toLowerCase();
      return terms.every(function (t) { return hay.indexOf(t) >= 0; });
    });
  }
  function draw() {
    if (!st.shown.length) {
      list.innerHTML = '<div class="none">Inga träffar.</div>';
      return;
    }
    list.innerHTML = st.shown.map(function (o, i) {
      return '<div data-v="' + esc(o.value) + '" role="option"' +
        (String(o.value) === String(hidden.value) ? ' aria-selected="true"' : "") +
        ' class="' + (i === st.active ? "on " : "") + (String(o.value) === String(hidden.value) ? "cur" : "") + '">' +
        esc(o.label) + "</div>";
    }).join("");
    var on = list.querySelector(".on");
    if (on) on.scrollIntoView({ block: "nearest" });
  }
  function open(text) {
    st.shown = filter(text);
    st.active = st.shown.length ? 0 : -1;
    st.open = true;
    list.style.display = "block";
    q.setAttribute("aria-expanded", "true");
    draw();
  }
  function close() {
    st.open = false;
    list.style.display = "none";
    q.setAttribute("aria-expanded", "false");
  }
  function pick(value) {
    hidden.value = value == null ? "" : String(value);
    q.value = labelFor(hidden.value);
    close();
    if (onChange) onChange(hidden.value);
  }

  q.addEventListener("focus", function () { open(""); q.select(); });
  q.addEventListener("input", function () {
    if (!q.value.trim()) { hidden.value = ""; if (onChange) onChange(""); }
    open(q.value);
  });
  q.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!st.open) { open(q.value); return; }
      if (!st.shown.length) return;
      st.active = (st.active + (e.key === "ArrowDown" ? 1 : -1) + st.shown.length) % st.shown.length;
      draw();
    } else if (e.key === "Enter") {
      if (st.open && st.active >= 0) { e.preventDefault(); pick(st.shown[st.active].value); }
    } else if (e.key === "Escape") {
      if (st.open) { e.stopPropagation(); close(); q.value = labelFor(hidden.value); }
    }
  });
  q.addEventListener("blur", function () {
    setTimeout(function () { close(); q.value = labelFor(hidden.value); }, 120);
  });
  // mousedown före blur, annars hinner listan stängas innan klicket landar.
  list.addEventListener("mousedown", function (e) {
    var opt = e.target.closest("div[data-v]");
    if (!opt) return;
    e.preventDefault();
    pick(opt.getAttribute("data-v"));
  });
}

function comboSet(id, value) {
  var hidden = document.getElementById(id);
  var q = document.getElementById(id + "-q");
  var st = COMBOS[id];
  if (!hidden || !q || !st) return;
  var label = "";
  for (var i = 0; i < st.options.length; i++) {
    if (String(st.options[i].value) === String(value)) label = st.options[i].label;
  }
  hidden.value = label ? String(value) : "";
  q.value = label;
}

function comboValue(id) {
  var hidden = document.getElementById(id);
  return hidden ? hidden.value : "";
}

// ---------- Livepollning ----------
// Tävlingsdagens vyer uppdaterar sig själva: aktiv vy pollar var LIVE_MS ms och ritar
// bara om när svaret faktiskt ändrats. Pausar när webbläsarfliken är dold och när vyn
// håller på med en redigering (hold), så pågående inmatning aldrig skrivs över.
var LIVE_MS = 3000;
var live = { load: null, hold: null, snap: null, busy: false, okAt: null };

function liveStart(load, hold) {
  clearInterval(refreshTimer);
  live.load = load; live.hold = hold || null;
  live.snap = null; live.busy = false; live.okAt = null;
  liveRun(false);
  refreshTimer = setInterval(function () { liveRun(true); }, LIVE_MS);
}

function liveStop() {
  clearInterval(refreshTimer);
  live.load = null; live.hold = null; live.snap = null; live.busy = false; live.okAt = null;
  var el = document.getElementById("liveInfo");
  if (el) el.style.display = "none";
}

function liveRun(bg) {
  if (!live.load || live.busy) return;
  if (bg && (document.hidden || (live.hold && live.hold()))) return;
  live.busy = true;
  Promise.resolve(live.load(bg)).then(function () {
    live.busy = false;
    live.okAt = new Date().toTimeString().slice(0, 8);
    liveStamp("");
  }, function () {
    live.busy = false;
    liveStamp("err");
  });
}

/** Diskret kvitto i sidhuvudet på att vyn uppdaterar sig själv. */
function liveStamp(state) {
  var el = document.getElementById("liveInfo");
  if (!el) return;
  el.style.display = "";
  el.className = "live" + (state ? " " + state : "");
  el.title = state === "err"
    ? "Kunde inte uppdatera — visar senast hämtade datat. Nytt försök om några sekunder."
    : "Vyn uppdaterar sig själv var " + Math.round(LIVE_MS / 1000) + ":e sekund och ritar om när något ändras.";
  el.innerHTML = "<i></i>" + (state === "err" ? "avbrott · senast " + (live.okAt || "–") : "live · " + live.okAt);
}

/** Sant när svaret skiljer sig från det som ritades senast — bakgrundspoll utan ändring ritar inte om. */
function liveChanged(bg, data) {
  var snap = JSON.stringify(data);
  if (bg === true && snap === live.snap) return false;
  live.snap = snap;
  return true;
}

document.addEventListener("visibilitychange", function () {
  if (!document.hidden) liveRun(true);
});

// ---------- Login ----------
function showLogin() {
  liveStop();
  app.innerHTML =
    '<div class="login"><img class="logo" src="/logo.svg" alt="SM i Burgare">' +
    '<h2>Tävlingsadmin</h2>' +
    '<p class="muted">Ange admin-nyckeln för att fortsätta.</p>' +
    '<input type="password" id="tok" placeholder="Admin-nyckel" autofocus>' +
    '<button class="act" id="loginBtn">Logga in</button>' +
    '<div class="msg" id="loginMsg"></div></div>';
  function attempt() {
    token = document.getElementById("tok").value.trim();
    api("/admin/ping").then(function () {
      sessionStorage.setItem("adminToken", token);
      shell(); go(currentView, currentQuery, true);
    }).catch(function () { msg("loginMsg", "err", "Fel nyckel."); });
  }
  document.getElementById("loginBtn").addEventListener("click", attempt);
  document.getElementById("tok").addEventListener("keydown", function (e) { if (e.key === "Enter") attempt(); });
}

// ---------- Skal och navigation ----------
var VIEWS = [
  ["oversikt", "Översikt"], ["tilldela", "Tilldela"], ["papper", "Papper"], ["rostkort", "Röstkort"], ["lag", "Lag"],
  ["domare", "Domare"], ["avdrag", "Avdrag"], ["resultat", "Resultat"], ["installningar", "Inställningar"], ["data", "Data"],
];

function shell() {
  app.innerHTML =
    '<header><div class="brand"><img class="logo" src="/logo.svg" alt="">' +
    '<div><div class="kicker">SM i Hamburgare</div><h1>Tävlingsadmin</h1></div></div>' +
    '<div class="row" style="gap:12px"><span id="liveInfo" class="live" style="display:none"></span>' +
    '<button class="sec" id="logout">Logga ut</button></div></header>' +
    "<nav>" + VIEWS.map(function (v) { return '<button data-v="' + v[0] + '">' + v[1] + "</button>"; }).join("") + "</nav>" +
    '<div id="main"></div>';
  document.getElementById("logout").addEventListener("click", function () {
    sessionStorage.removeItem("adminToken"); token = ""; showLogin();
  });
  app.querySelector("nav").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-v]");
    if (b) go(b.getAttribute("data-v"));
  });
}

function hashFor(view, query) {
  return view + (query ? "?" + query : "");
}

function parseHash() {
  var h = location.hash.replace(/^#/, "");
  var i = h.indexOf("?");
  return { view: (i < 0 ? h : h.slice(0, i)) || "oversikt", query: i < 0 ? "" : h.slice(i + 1) };
}

/** Byter vy och lägger den i historiken. replace = byt ut nuvarande post i stället. */
function go(view, query, replace) {
  var hash = "#" + hashFor(view, query);
  if (replace && history.replaceState) history.replaceState(null, "", hash);
  else if (location.hash !== hash) location.hash = hash;
  show(view, query);
}

/** Ritar upp vyn. renderedHash håller reda på vad som faktiskt visas just nu. */
function show(view, query) {
  currentView = view;
  currentQuery = query || "";
  renderedHash = hashFor(view, currentQuery);
  liveStop();
  app.querySelectorAll("nav button").forEach(function (b) {
    b.classList.toggle("active", b.getAttribute("data-v") === view);
  });
  var main = document.getElementById("main");
  main.innerHTML = '<div class="card muted">Laddar …</div>';
  RENDER[view](main, new URLSearchParams(currentQuery));
}

/**
 * Uppdaterar adressraden utan att lägga till en historikpost — för filter som ändras
 * ofta. Bak-knappen ska ta dig till föregående vy, inte backa filter för filter.
 */
function syncHash(view, query) {
  var hash = "#" + hashFor(view, query);
  if (location.hash === hash) return;
  renderedHash = hashFor(view, query);
  currentQuery = query || "";
  if (history.replaceState) history.replaceState(null, "", hash);
}

// Bak/framåt i webbläsaren: rita om när adressen pekar på något annat än det som visas.
window.addEventListener("hashchange", function () {
  var h = parseHash();
  if (hashFor(h.view, h.query) === renderedHash) return; // vi satte den själva
  if (!token || !document.getElementById("main")) return; // inloggningsvyn — låt den vara
  if (!RENDER[h.view]) return;
  show(h.view, h.query);
});

// ---------- Översikt (dashboard) ----------
function renderOversikt(main) {
  function load(bg) {
    return api("/admin/overview").then(function (r) {
      if (!liveChanged(bg, r.data)) return;
      var d = r.data;
      var html = '<div class="statgrid">' +
        '<div class="stat"><b>' + d.totals.votes + "</b><span>röster</span></div>" +
        '<div class="stat"><b>' + d.totals.cards + "</b><span>kort i registret</span></div>" +
        '<div class="stat"><b>' + d.conflictCount + "</b><span>konflikter</span></div>" +
        '<div class="stat"><b>' + d.totals.rejected + "</b><span>avvisade försök</span></div></div>";

      var recent = d.recentVotes || [];
      html += '<div class="card"><h2>Senast inkomna röstkort</h2>';
      if (!recent.length) {
        html += '<p class="muted">Inga röster ännu.</p>';
      } else {
        html += "<table><tr><th>Tid</th><th>Lag</th><th>Gren</th><th>Domare</th><th>Gruppkod</th><th>Källa</th></tr>" +
          recent.map(function (v) {
            return "<tr><td class=muted>" + esc(svTid(v.created_at, "hms")) + "</td>" +
              '<td style="font-weight:600">' + (v.team ? esc(v.team) : '<span class="warn">ej kopplad</span>') + "</td>" +
              "<td class=muted>" + esc(v.gren || "") + "</td><td>" + esc(v.judge) + (v.edited_at ? '<span class="edited">ändrad</span>' : "") +
              "</td><td class=muted>" + esc(v.lagkod) + "</td><td class=muted>" + (v.source === "paper" ? "papper" : "digital") + "</td></tr>";
          }).join("") + "</table>" +
          '<div class="row" style="margin-top:10px"><button class="sec" id="allaKort">Se alla röstkort →</button></div>';
      }
      html += "</div>";

      html += '<div class="dash" style="margin-top:12px"><div>';
      var byGren = {};
      var grenOrder = [];
      d.assignments.forEach(function (a) {
        if (!byGren[a.gren]) { byGren[a.gren] = []; grenOrder.push(a.gren); }
        byGren[a.gren].push(a);
      });
      if (!grenOrder.length) {
        html += '<div class="card" style="margin-top:0"><h2>Grenar</h2><p class="muted">Inga gruppkoder kopplade ännu.</p></div>';
      }
      grenOrder.forEach(function (gren, gi) {
        var rows = byGren[gren];
        var max = rows.reduce(function (m, a) { return Math.max(m, a.votes); }, 0);
        var sum = rows.reduce(function (s, a) { return s + a.votes; }, 0);
        html += '<div class="card"' + (gi === 0 ? ' style="margin-top:0"' : "") + "><h2>" + esc(gren) +
          ' <span class="badge">' + rows.length + " bidrag · " + sum + " röster</span></h2>" +
          "<table><tr><th>Lag</th><th>Gruppkod</th><th class=num>Röster</th></tr>" +
          rows.map(function (a) {
            var pct = max > 0 ? Math.round((a.votes / max) * 100) : 0;
            return '<tr><td style="font-weight:600">' + esc(a.team) + "</td><td class=muted>" + esc(a.lagkod) +
              '</td><td class=num><span class="bar"><i style="width:' + pct + '%"></i></span>' + a.votes + "</td></tr>";
          }).join("") + "</table></div>";
      });
      html += '<p class="muted" style="margin-top:8px">Stapeln jämför med bidraget som fått flest röster i grenen. Fler kort trycks än det finns domare — röstningen är klar långt innan alla kort är använda.</p>';
      html += "</div>";

      html += "<div>";
      if (d.unassignedWithVotes.length) {
        html += '<div class="card" style="margin-top:0"><h2 style="color:var(--amber)">⚠ Väntar på koppling</h2><p class="muted">Röster utan lag — koppla dem under Tilldela.</p><div style="margin-top:8px">' +
          d.unassignedWithVotes.map(function (u) {
            return '<span class="chip" data-lagkod="' + esc(u.lagkod) + '">' + esc(u.lagkod) + " · " + u.votes + " röster</span>";
          }).join("") + "</div></div>";
      }
      if (d.conflictCount > 0) {
        html += '<div class="card"' + (d.unassignedWithVotes.length ? "" : ' style="margin-top:0"') + '><h2>Omregistreringsförsök</h2><div id="confList" class="muted">Laddar …</div></div>';
      }
      if (!d.unassignedWithVotes.length && d.conflictCount === 0) {
        html += '<div class="card" style="margin-top:0"><h2>Status</h2><p class="muted">Inga okopplade gruppkoder och inga konflikter. Allt ser bra ut.</p></div>';
      }
      html += "</div></div>";

      main.innerHTML = html;
      main.querySelectorAll(".chip").forEach(function (c) {
        c.addEventListener("click", function () { go("tilldela"); });
      });
      var allaKort = document.getElementById("allaKort");
      if (allaKort) allaKort.addEventListener("click", function () { go("rostkort"); });
      if (d.conflictCount > 0) {
        api("/admin/conflicts").then(function (cr) {
          var rows = cr.data.conflicts.filter(function (k) { return k.reason === "duplicate_conflict"; });
          var el = document.getElementById("confList");
          if (!el) return;
          el.innerHTML = rows.map(function (k) {
            return '<div style="padding:8px 0;border-bottom:1px solid var(--panel2);font-size:.84rem">' +
              '<div style="color:var(--ink);font-weight:600">' + esc(svTid(k.received_at, "hms")) + " · " + esc((k.kortid || "").slice(0, 8)) + "</div>" +
              '<div style="margin-top:2px">Gäller: ' + esc(k.accepted_judge || "?") + " · " + esc(k.accepted_scores || "") + "</div>" +
              '<div>Avvisat: ' + esc(k.judge_name || "?") + " · " + esc(k.scores || "") + " (" + esc(k.source || "") + ")</div></div>";
          }).join("");
        });
      }
    });
  }
  liveStart(load);
}

// ---------- Tilldela ----------
function renderTilldela(main) {
  Promise.all([api("/admin/teams"), api("/admin/grenar")]).then(function (rs) {
    var teams = rs[0].data.teams.filter(function (t) { return t.active; });
    var grenar = rs[1].data.grenar.filter(function (g) { return g.active; });
    // Vi tilldelar en gren i taget under dagen, så senast valda gren ligger kvar.
    var lastGren = localStorage.getItem("senasteGren") || "";
    if (!grenar.some(function (g) { return String(g.id) === lastGren; })) lastGren = "";
    // Formuläret ritas en gång; chipsen och kopplingslistan fylls på av livepollningen
    // i egna behållare, så pågående inmatning aldrig skrivs över.
    var html = '<div class="card"><h2>Koppla gruppkod till lag och gren</h2>' +
      '<p class="muted">Ta bunten som serverats, läs gruppkoden på korten och koppla den till laget.</p>' +
      '<div class="row" style="margin-top:8px">' +
      '<input id="asLagkod" placeholder="Gruppkod (t.ex. SODG)" size="12" style="text-transform:uppercase">' +
      comboHtml("asTeam", "Sök lag …", 230) +
      '<select id="asGren">' + grenar.map(function (g) {
        return '<option value="' + g.id + '"' + (String(g.id) === lastGren ? " selected" : "") + ">" + esc(g.name) + "</option>";
      }).join("") + "</select>" +
      '<button class="act" id="asBtn">Koppla</button></div>' +
      '<div class="row" style="margin-top:8px"><input id="newTeamName" placeholder="Nytt lag …" size="18"><button class="sec" id="newTeamBtn">+ Skapa lag</button></div>' +
      '<div class="msg" id="asMsg"></div>' +
      '<div id="asWaiting"></div></div>' +
      '<div class="card"><h2>Befintliga kopplingar</h2><div id="asList"><span class="muted">Laddar …</span></div></div>';
    main.innerHTML = html;
    comboInit("asTeam", teams.map(function (t) { return { value: t.id, label: t.name }; }));
    document.getElementById("asGren").addEventListener("change", function (e) {
      localStorage.setItem("senasteGren", e.target.value);
    });

    function fill(ov) {
      var waiting = document.getElementById("asWaiting");
      waiting.innerHTML = !ov.unassignedWithVotes.length ? "" :
        '<div style="margin-top:10px"><span class="muted">Väntar på koppling:</span><br>' +
        ov.unassignedWithVotes.map(function (u) { return '<span class="chip" data-k="' + esc(u.lagkod) + '">' + esc(u.lagkod) + " · " + u.votes + "</span>"; }).join("") + "</div>";
      waiting.querySelectorAll(".chip").forEach(function (c) {
        c.addEventListener("click", function () { document.getElementById("asLagkod").value = c.getAttribute("data-k"); });
      });
      var list = document.getElementById("asList");
      list.innerHTML = "<table><tr><th>Gruppkod</th><th>Lag</th><th>Gren</th><th class=num>Röster</th><th></th></tr>" +
        ov.assignments.map(function (a) {
          return "<tr><td>" + esc(a.lagkod) + "</td><td>" + esc(a.team) + "</td><td>" + esc(a.gren) +
            "</td><td class=num>" + a.votes + '</td><td><button class="sec danger" data-del="' + esc(a.lagkod) + '">Ta bort</button></td></tr>';
        }).join("") + "</table>";
      list.querySelectorAll("[data-del]").forEach(function (b) {
        b.addEventListener("click", function () {
          var lagkod = b.getAttribute("data-del");
          if (!confirm("Ta bort kopplingen för " + lagkod + "? Rösterna finns kvar och kan kopplas om.")) return;
          api("/admin/assign/" + encodeURIComponent(lagkod), { method: "DELETE" }).then(function (r) {
            if (!r.data.ok) { msg("asMsg", "err", r.data.message || "Kunde inte ta bort kopplingen."); return; }
            flash("ok", "Kopplingen för " + lagkod + " borttagen.");
            load();
          });
        });
      });
    }

    function load(bg) {
      return api("/admin/overview").then(function (r) {
        if (!liveChanged(bg, { u: r.data.unassignedWithVotes, a: r.data.assignments })) return;
        fill(r.data);
      });
    }

    document.getElementById("newTeamBtn").addEventListener("click", function () {
      var name = document.getElementById("newTeamName").value.trim();
      if (!name) return;
      api("/admin/teams", { method: "POST", body: { name: name } }).then(function (r) {
        if (r.status === 201) { flash("ok", "Laget " + name + " skapat."); renderTilldela(main); }
        else msg("asMsg", "err", r.data.message || "Kunde inte skapa laget.");
      });
    });
    document.getElementById("asBtn").addEventListener("click", function () {
      var lagkod = document.getElementById("asLagkod").value.trim().toUpperCase();
      var teamId = Number(comboValue("asTeam"));
      var grenId = Number(document.getElementById("asGren").value);
      if (!lagkod || !teamId || !grenId) { msg("asMsg", "err", "Fyll i gruppkod, lag och gren."); return; }
      localStorage.setItem("senasteGren", String(grenId));
      api("/admin/assign", { method: "POST", body: { lagkod: lagkod, teamId: teamId, grenId: grenId } }).then(function (r) {
        if (r.data.ok) { flash("ok", lagkod + " kopplad."); renderTilldela(main); }
        else msg("asMsg", "err", r.data.message || "Fel vid koppling.");
      });
    });
    liveStart(load);
  });
}

// ---------- Pappersinmatning ----------
function renderPapper(main) {
  fetch("/api/config").then(function (r) { return r.json(); }).then(function (config) {
    cache.config = config;
    var enteredBy = localStorage.getItem("adminNamn") || "";
    var html = '<div class="card"><h2>Registrera pappersröstkort</h2>' +
      '<div class="row"><input id="ppKort" placeholder="Kortets ID (uuid under QR-koden)" size="40">' +
      '<button class="sec" id="ppFetch">Hämta kort</button></div>' +
      '<div class="muted" id="ppInfo" style="margin-top:6px"></div>' +
      '<div id="ppForm" style="display:none;margin-top:10px">' +
      '<div class="row"><input id="ppJudge" list="ppJudges" placeholder="Domarens namn" size="24">' +
      '<datalist id="ppJudges">' + config.judges.map(function (j) { return '<option value="' + esc(j) + '">'; }).join("") + "</datalist>" +
      '<input id="ppEnteredBy" placeholder="Registreras av (du)" size="16" value="' + esc(enteredBy) + '"></div>' +
      config.criteria.map(function (c) {
        return '<div style="margin-top:10px"><b>' + esc(c.label) + '</b> <span class="muted" id="ppVal-' + esc(c.key) + '"></span>' +
          '<div class="btns" data-key="' + esc(c.key) + '">' +
          Array.from({ length: 11 }, function (_, i) { return '<button type="button" data-v="' + i + '">' + i + "</button>"; }).join("") +
          "</div></div>";
      }).join("") +
      '<div style="margin-top:10px"><input id="ppComment" placeholder="Kommentar (frivilligt)" style="width:100%"></div>' +
      '<div class="row" style="margin-top:12px"><button class="act" id="ppSubmit">Registrera röst</button>' +
      '<button class="sec danger" id="ppOverride" style="display:none">Ersätt registrerad röst (override)</button></div>' +
      "</div><div class='msg' id='ppMsg'></div></div>";
    main.innerHTML = html;

    var scores = {};
    var lastPayload = null;

    main.querySelectorAll(".btns").forEach(function (row) {
      row.addEventListener("click", function (ev) {
        var b = ev.target.closest("button[data-v]");
        if (!b) return;
        var key = row.getAttribute("data-key");
        scores[key] = Number(b.getAttribute("data-v"));
        row.querySelectorAll("button").forEach(function (x) { x.classList.toggle("sel", x === b); });
        document.getElementById("ppVal-" + key).textContent = b.getAttribute("data-v");
      });
    });

    document.getElementById("ppFetch").addEventListener("click", function () {
      var kortid = document.getElementById("ppKort").value.trim();
      if (!kortid) return;
      fetch("/api/card/" + encodeURIComponent(kortid)).then(function (r) { return r.json().then(function (d) { return { s: r.status, d: d }; }); }).then(function (r) {
        var info = document.getElementById("ppInfo");
        if (r.s === 404) { info.innerHTML = '<span class="warn">Okänt kort.</span>'; document.getElementById("ppForm").style.display = "none"; return; }
        info.innerHTML = "Grupp <b>" + esc(r.d.lagkod) + "</b>" + (r.d.used ? ' — <span class="warn">redan registrerat!</span> Registrering kräver override.' : " — inte registrerat ännu.");
        document.getElementById("ppForm").style.display = "block";
        document.getElementById("ppOverride").style.display = "none";
      });
    });

    function submit(override) {
      var kortid = document.getElementById("ppKort").value.trim();
      var judge = document.getElementById("ppJudge").value.trim();
      var by = document.getElementById("ppEnteredBy").value.trim();
      if (!kortid || !judge) { msg("ppMsg", "err", "Kort-ID och domarnamn krävs."); return; }
      var missing = cache.config.criteria.filter(function (c) { return typeof scores[c.key] !== "number"; });
      if (missing.length) { msg("ppMsg", "err", "Poäng saknas för: " + missing.map(function (c) { return c.label; }).join(", ")); return; }
      localStorage.setItem("adminNamn", by);
      lastPayload = { kortid: kortid, judge: judge, scores: Object.assign({}, scores), comment: document.getElementById("ppComment").value, enteredBy: by, override: override === true };
      api("/admin/vote", { method: "POST", body: lastPayload }).then(function (r) {
        if (!r.data.ok) { msg("ppMsg", "err", r.data.message || "Fel."); return; }
        if (r.data.status === "accepted" || r.data.status === "replaced") {
          msg("ppMsg", "ok", r.data.status === "replaced" ? "Rösten ersatt (loggad som override)." : "Rösten registrerad.");
          scores = {};
          document.getElementById("ppForm").style.display = "none";
          document.getElementById("ppKort").value = "";
          document.getElementById("ppInfo").textContent = "";
          document.getElementById("ppComment").value = "";
          document.getElementById("ppJudge").value = "";
        } else if (r.data.status === "duplicate") {
          msg("ppMsg", "err", r.data.identical ? "Kortet är redan registrerat med exakt samma innehåll — inget behövde göras." : "Kortet är redan registrerat med ANNAT innehåll. Kontrollera vad som stämmer; först inlämnad gäller. Vill du ersätta, använd override-knappen.");
          if (!r.data.identical) document.getElementById("ppOverride").style.display = "inline-block";
        }
      });
    }
    document.getElementById("ppSubmit").addEventListener("click", function () { submit(false); });
    document.getElementById("ppOverride").addEventListener("click", function () {
      if (confirm("Ersätta den registrerade rösten? Åtgärden loggas.")) submit(true);
    });
  });
}

// ---------- Röstkort ----------
function renderRostkort(main, params) {
  Promise.all([
    api("/admin/judges"),
    api("/admin/teams"),
    api("/admin/grenar"),
    fetch("/api/config").then(function (r) { return r.json(); }),
  ]).then(function (rs) {
    var judges = rs[0].data.judges.filter(function (j) { return j.alias_of === null; });
    var teams = rs[1].data.teams;
    var grenar = rs[2].data.grenar;
    var criteria = rs[3].criteria;
    cache.config = rs[3];
    var editing = null;
    var editScores = {};
    var justSaved = null;
    var lastQs = null;

    var head = '<div class="card"><h2>Röstkort</h2>' +
      '<p class="muted">Alla registrerade röster. Filtrera fram rätt kort och rätta vid behov — varje ändring loggas.</p>' +
      '<div class="row" style="margin-top:8px">' +
      comboHtml("fJudge", "Alla domare", 200) +
      comboHtml("fTeam", "Alla lag", 200) +
      '<select id="fGren"><option value="">Alla grenar</option>' +
      grenar.map(function (g) { return '<option value="' + g.id + '">' + esc(g.name) + "</option>"; }).join("") + "</select>" +
      '<input id="fLagkod" placeholder="Gruppkod" size="10" style="text-transform:uppercase">' +
      '<button class="sec" id="fClear">Rensa</button>' +
      '<span class="muted" id="fCount"></span></div>' +
      '<div class="msg" id="rkMsg"></div></div>' +
      '<div class="card" id="rkTable"><span class="muted">Laddar …</span></div>';
    main.innerHTML = head;

    comboInit("fJudge", judges.map(function (j) { return { value: j.id, label: j.name + " (" + j.votes + ")" }; }), load);
    comboInit("fTeam", teams.map(function (t) { return { value: t.id, label: t.name }; }), load);
    comboSet("fJudge", params.get("judge") || "");
    comboSet("fTeam", params.get("team") || "");
    if (params.get("gren")) document.getElementById("fGren").value = params.get("gren");
    if (params.get("lagkod")) document.getElementById("fLagkod").value = params.get("lagkod");
    document.getElementById("fGren").addEventListener("change", load);
    document.getElementById("fLagkod").addEventListener("change", load);
    document.getElementById("fClear").addEventListener("click", function () {
      comboSet("fJudge", ""); comboSet("fTeam", "");
      document.getElementById("fGren").value = "";
      document.getElementById("fLagkod").value = "";
      load();
    });

    function shortLabel(c) { return c.label.split("/")[0]; }

    function editedTitle(v) {
      return "Rättat " + svTid(v.edited_at, "lang") + (v.edited_by ? " av " + v.edited_by : "") +
        (v.edited_reason ? " — " + v.edited_reason : "");
    }

    function load(bg) {
      bg = bg === true;
      var qs;
      if (bg && lastQs !== null) {
        // Bakgrundspollen återanvänder senast bekräftade filtret — halvskrivna
        // filterfält ska inte börja gälla förrän de bekräftats (change/val i listan).
        qs = lastQs;
      } else {
        // Adressraden använder korta namn (team=), API:et sina egna (teamId=).
        var filters = [
          ["judge", "judgeId", comboValue("fJudge")],
          ["team", "teamId", comboValue("fTeam")],
          ["gren", "grenId", document.getElementById("fGren").value],
          ["lagkod", "lagkod", document.getElementById("fLagkod").value.trim().toUpperCase()],
        ].filter(function (f) { return f[2]; });
        syncHash("rostkort", filters.map(function (f) { return f[0] + "=" + encodeURIComponent(f[2]); }).join("&"));
        qs = filters.map(function (f) { return f[1] + "=" + encodeURIComponent(f[2]); }).join("&");
        lastQs = qs;
      }
      return api("/admin/votes" + (qs ? "?" + qs : "")).then(function (r) {
        if (!liveChanged(bg, r.data)) return;
        draw(r.data.votes, r.data.limit);
      });
    }

    function draw(votes, limit) {
      document.getElementById("fCount").textContent =
        votes.length + " röstkort" + (limit && votes.length >= limit ? " (visar de " + limit + " senaste)" : "");
      var box = document.getElementById("rkTable");
      if (!votes.length) {
        box.innerHTML = '<p class="muted">Inga röstkort matchar filtret.</p>';
        return;
      }
      var cols = 7 + criteria.length;
      box.innerHTML = "<table><tr><th>Tid</th><th>Lag</th><th>Gren</th><th>Gruppkod</th><th>Domare</th>" +
        criteria.map(function (c) { return '<th class=num>' + esc(shortLabel(c)) + "</th>"; }).join("") +
        "<th>Kommentar</th><th>Källa</th><th></th></tr>" +
        votes.map(function (v) {
          var cls = editing === v.kortid ? "editing" : (justSaved === v.kortid ? "saved" : "");
          var row = "<tr" + (cls ? ' class="' + cls + '"' : "") + "><td class=muted>" + esc(svTid(v.created_at, "dhm")) + "</td>" +
            '<td style="font-weight:600">' + (v.team ? esc(v.team) : '<span class="warn">ej kopplad</span>') + "</td>" +
            "<td class=muted>" + esc(v.gren || "") + "</td><td class=muted>" + esc(v.lagkod) + "</td>" +
            "<td>" + esc(v.judge) + (v.edited_at ? '<span class="edited" title="' + esc(editedTitle(v)) + '">ändrad</span>' : "") + "</td>" +
            criteria.map(function (c) { return "<td class=num>" + (v.scores[c.key] === undefined ? "–" : v.scores[c.key]) + "</td>"; }).join("") +
            "<td>" + esc(v.comment || "") + "</td><td class=muted>" + (v.source === "paper" ? "papper" : "digital") + "</td>" +
            '<td><button class="sec" data-edit="' + esc(v.kortid) + '">Ändra</button></td></tr>';
          if (editing !== v.kortid) return row;
          return row + '<tr class="editing"><td colspan="' + cols + '">' +
            '<div class="row"><input id="edJudge" list="edJudges" size="22" value="' + esc(v.judge) + '" placeholder="Domare">' +
            '<datalist id="edJudges">' + judges.map(function (j) { return '<option value="' + esc(j.name) + '">'; }).join("") + "</datalist>" +
            '<span class="muted">Kort ' + esc(v.kortid.slice(0, 8)) + " · registrerat " + esc(svTid(v.created_at, "lang")) +
            (v.edited_at ? " · senast rättat " + esc(svTid(v.edited_at, "lang")) + (v.edited_by ? " av " + esc(v.edited_by) : "") : "") +
            "</span></div>" +
            criteria.map(function (c) {
              return '<div style="margin-top:10px"><b>' + esc(c.label) + '</b> <span class="muted" id="edVal-' + esc(c.key) + '">' +
                (editScores[c.key] === undefined ? "" : editScores[c.key]) + "</span>" +
                '<div class="btns" data-key="' + esc(c.key) + '">' +
                Array.from({ length: 11 }, function (_, i) {
                  return '<button type="button" data-v="' + i + '"' + (editScores[c.key] === i ? ' class="sel"' : "") + ">" + i + "</button>";
                }).join("") + "</div></div>";
            }).join("") +
            '<div style="margin-top:10px"><input id="edComment" style="width:100%" placeholder="Domarens kommentar till laget" value="' + esc(v.comment || "") + '"></div>' +
            '<div style="margin-top:10px"><input id="edReason" style="width:100%" placeholder="Varför rättas det här kortet? (t.ex. felläst siffra på papperskortet)"' +
            (v.edited_reason ? ' title="Förra motiveringen: ' + esc(v.edited_reason) + '"' : "") + "></div>" +
            '<div class="row" style="margin-top:12px"><button class="act" id="edSave">Spara ändring</button>' +
            '<button class="sec" id="edCancel">Avbryt</button>' +
            '<input id="edBy" size="16" placeholder="Ditt namn" value="' + esc(localStorage.getItem("adminNamn") || "") + '">' +
            '<span class="muted">Motiveringen gäller det här kortet. Ditt namn sparas till nästa gång.</span></div>' +
            '<div class="msg" id="edMsg"></div></td></tr>';
        }).join("") + "</table>";

      var sparad = box.querySelector("tr.saved");
      if (sparad) {
        justSaved = null;
        sparad.scrollIntoView({ block: "nearest" });
      }

      box.querySelectorAll("[data-edit]").forEach(function (b) {
        b.addEventListener("click", function () {
          var kortid = b.getAttribute("data-edit");
          var v = votes.find(function (x) { return x.kortid === kortid; });
          editing = editing === kortid ? null : kortid;
          editScores = editing ? Object.assign({}, v.scores) : {};
          draw(votes, limit);
        });
      });
      if (!editing) return;

      box.querySelectorAll(".btns").forEach(function (row) {
        row.addEventListener("click", function (ev) {
          var b = ev.target.closest("button[data-v]");
          if (!b) return;
          var key = row.getAttribute("data-key");
          editScores[key] = Number(b.getAttribute("data-v"));
          row.querySelectorAll("button").forEach(function (x) { x.classList.toggle("sel", x === b); });
          document.getElementById("edVal-" + key).textContent = b.getAttribute("data-v");
        });
      });
      document.getElementById("edCancel").addEventListener("click", function () { editing = null; draw(votes, limit); });
      document.getElementById("edSave").addEventListener("click", function () {
        var v = votes.find(function (x) { return x.kortid === editing; });
        var judge = document.getElementById("edJudge").value.trim();
        var by = document.getElementById("edBy").value.trim();
        var reason = document.getElementById("edReason").value.trim();
        var comment = document.getElementById("edComment").value;
        var missing = criteria.filter(function (c) { return typeof editScores[c.key] !== "number"; });
        // Meddelanden hör hemma i redigeringsrutan — listan kan vara hundratals rader lång.
        if (!judge) { msg("edMsg", "err", "Domarnamn krävs."); return; }
        if (missing.length) { msg("edMsg", "err", "Poäng saknas för: " + missing.map(function (c) { return c.label; }).join(", ")); return; }
        var andrat = judge !== v.judge || comment.trim() !== (v.comment || "") ||
          criteria.some(function (c) { return editScores[c.key] !== v.scores[c.key]; });
        if (!andrat) { msg("edMsg", "err", "Inget är ändrat på kortet ännu."); return; }
        if (!reason) { msg("edMsg", "err", "Skriv varför kortet rättas — motiveringen loggas med ändringen."); return; }
        if (by) localStorage.setItem("adminNamn", by);
        api("/admin/votes/" + encodeURIComponent(editing), { method: "PATCH", body: {
          judge: judge, scores: editScores, comment: comment, editedBy: by, reason: reason,
        } }).then(function (r) {
          if (!r.data.ok) { msg("edMsg", "err", r.data.message || "Kunde inte spara."); return; }
          msg("rkMsg", "ok", r.data.unchanged ? "Inget ändrat." : "Röstkortet uppdaterat och ändringen loggad.");
          justSaved = editing;
          editing = null;
          load();
        });
      });
    }

    liveStart(load, function () { return editing !== null; });
  });
}

// ---------- Lag ----------
function renderLag(main) {
  api("/admin/teams").then(function (r) {
    var html = '<div class="card"><h2>Lag</h2>' +
      '<div class="row"><input id="lagName" placeholder="Nytt lag …" size="24"><button class="act" id="lagAdd">+ Lägg till</button></div>' +
      '<div class="msg" id="lagMsg"></div>' +
      "<table style='margin-top:10px'><tr><th>Lag</th><th class=num>Kopplingar</th><th>Status</th><th></th></tr>" +
      r.data.teams.map(function (t) {
        return "<tr><td>" + esc(t.name) + "</td><td class=num>" + t.assignments + "</td><td>" + (t.active ? "aktivt" : '<span class="muted">inaktivt</span>') + "</td>" +
          '<td class="row"><button class="sec" data-kort="' + t.id + '">Röstkort</button>' +
          '<button class="sec" data-ren="' + t.id + '" data-name="' + esc(t.name) + '">Byt namn</button>' +
          '<button class="sec" data-tog="' + t.id + '" data-act="' + t.active + '">' + (t.active ? "Inaktivera" : "Aktivera") + "</button></td></tr>";
      }).join("") + "</table></div>";
    main.innerHTML = html;
    main.querySelectorAll("[data-kort]").forEach(function (b) {
      b.addEventListener("click", function () { go("rostkort", "team=" + b.getAttribute("data-kort")); });
    });
    document.getElementById("lagAdd").addEventListener("click", function () {
      var name = document.getElementById("lagName").value.trim();
      if (!name) return;
      api("/admin/teams", { method: "POST", body: { name: name } }).then(function (r2) {
        if (r2.status !== 201) { msg("lagMsg", "err", r2.data.message || "Kunde inte skapa laget."); return; }
        flash("ok", "Laget " + name + " tillagt.");
        renderLag(main);
      });
    });
    main.querySelectorAll("[data-ren]").forEach(function (b) {
      b.addEventListener("click", function () {
        var old = b.getAttribute("data-name");
        var name = prompt("Nytt namn:", old);
        if (!name || name === old) return;
        api("/admin/teams/" + b.getAttribute("data-ren"), { method: "PATCH", body: { name: name } }).then(function (r2) {
          if (!r2.data.ok) { msg("lagMsg", "err", r2.data.message || "Kunde inte byta namn."); return; }
          flash("ok", old + " heter nu " + name + ".");
          renderLag(main);
        });
      });
    });
    main.querySelectorAll("[data-tog]").forEach(function (b) {
      b.addEventListener("click", function () {
        var pa = b.getAttribute("data-act") !== "1";
        api("/admin/teams/" + b.getAttribute("data-tog"), { method: "PATCH", body: { active: pa } })
          .then(function (r2) {
            if (!r2.data.ok) { msg("lagMsg", "err", r2.data.message || "Kunde inte ändra status."); return; }
            flash("ok", "Laget är nu " + (pa ? "aktivt" : "inaktivt") + ".");
            renderLag(main);
          });
      });
    });
  });
}

// ---------- Domare ----------
function renderDomare(main) {
  api("/admin/judges").then(function (r) {
    var judges = r.data.judges;
    var merges = r.data.merges || [];
    var canon = judges.filter(function (j) { return j.alias_of === null; });
    var opts = canon.map(function (j) { return { value: j.id, label: j.name + " (" + j.votes + " röster)" }; });
    var html = '<div class="card"><h2>Domare</h2>' +
      '<p class="muted">Slå ihop dubbletter (t.ex. stavningsvarianter) — rösterna flyttas till målet och varianten blir alias. Nya röster som skrivs med variantnamnet hamnar också på målet. Sammanslagningen kan ångras.</p>' +
      '<div class="row" style="margin:8px 0">' + comboHtml("mFrom", "Sök variant/dubblett …", 230) +
      "<span>→</span>" + comboHtml("mTo", "Sök rätt namn …", 230) +
      '<button class="act" id="mBtn">Slå ihop</button></div><div class="msg" id="mMsg"></div>' +
      "<table style='margin-top:8px'><tr><th>Namn</th><th class=num>Röster</th><th>Alias</th><th></th></tr>" +
      judges.map(function (j) {
        var aliasName = j.alias_of !== null ? (judges.find(function (x) { return x.id === j.alias_of; }) || {}).name : null;
        return "<tr><td>" + esc(j.name) + "</td><td class=num>" + j.votes + "</td><td>" + (aliasName ? "→ " + esc(aliasName) : "") + "</td>" +
          '<td>' + (j.votes > 0 ? '<button class="sec" data-kort="' + j.id + '">Röstkort</button>' : "") + "</td></tr>";
      }).join("") + "</table></div>";

    if (merges.length) {
      html += '<div class="card"><h2>Sammanslagningar som kan ångras</h2>' +
        '<p class="muted">Ångra flyttar tillbaka rösterna som skrevs med variantnamnet, även de som kommit in efter slagningen. Röster som faktiskt skrevs med det rätta namnet står kvar.</p>' +
        "<table style='margin-top:8px'><tr><th>Tid</th><th>Från</th><th>Till</th><th class=num>Flyttade röster</th><th></th></tr>" +
        merges.map(function (m) {
          return "<tr><td class=muted>" + esc(svTid(m.created_at, "dhm")) + "</td><td>" + esc(m.from_name) + "</td><td>" + esc(m.to_name) +
            "</td><td class=num>" + m.movedVotes + '</td><td><button class="sec danger" data-undo="' + m.id + '" data-from="' + esc(m.from_name) +
            '" data-to="' + esc(m.to_name) + '">Ångra</button></td></tr>';
        }).join("") + "</table></div>";
    }
    main.innerHTML = html;
    comboInit("mFrom", opts);
    comboInit("mTo", opts);

    main.querySelectorAll("[data-kort]").forEach(function (b) {
      b.addEventListener("click", function () { go("rostkort", "judge=" + b.getAttribute("data-kort")); });
    });
    document.getElementById("mBtn").addEventListener("click", function () {
      var fromId = Number(comboValue("mFrom"));
      var toId = Number(comboValue("mTo"));
      if (!fromId || !toId || fromId === toId) { msg("mMsg", "err", "Välj två olika domare."); return; }
      var fromName = judges.find(function (j) { return j.id === fromId; }).name;
      var toName = judges.find(function (j) { return j.id === toId; }).name;
      if (!confirm('Flytta alla röster från "' + fromName + '" till "' + toName + '"?')) return;
      api("/admin/judges/merge", { method: "POST", body: { fromId: fromId, toId: toId } }).then(function (r2) {
        if (!r2.data.ok) { msg("mMsg", "err", r2.data.message || "Kunde inte slå ihop."); return; }
        flash("ok", fromName + " sammanslagen med " + toName + " (" + r2.data.movedVotes + " röster flyttade).");
        renderDomare(main);
      });
    });
    main.querySelectorAll("[data-undo]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (!confirm('Ångra sammanslagningen "' + b.getAttribute("data-from") + '" → "' + b.getAttribute("data-to") + '"?')) return;
        api("/admin/judges/merge/" + b.getAttribute("data-undo") + "/undo", { method: "POST", body: {} }).then(function (r2) {
          if (!r2.data.ok) { msg("mMsg", "err", r2.data.message || "Kunde inte ångra."); return; }
          flash("ok", "Sammanslagningen ångrad — " + r2.data.restoredVotes + " röster tillbaka.");
          renderDomare(main);
        });
      });
    });
  });
}

// ---------- Avdrag ----------
function renderAvdrag(main) {
  Promise.all([api("/admin/avdrag"), api("/admin/overview")]).then(function (rs) {
    var list = rs[0].data.avdrag;
    var assignments = rs[1].data.assignments;
    var by = localStorage.getItem("adminNamn") || "";
    var html = '<div class="card"><h2>Nytt avdrag</h2>' +
      '<p class="muted">Välj procent av bidragets poäng i grenen (100 % nollar bidraget) eller ett fast poängavdrag som dras från slutpoängen. Beslutet loggas.</p>' +
      '<div class="row" style="margin-top:8px">' + comboHtml("avLagkod", "Sök lag eller gren …", 280) +
      '<select id="avKind"><option value="pct">procent</option><option value="points">fasta poäng</option></select>' +
      '<input id="avValue" type="number" min="0" step="0.01" placeholder="%" style="width:90px">' +
      '<input id="avReason" placeholder="Motivering" size="28">' +
      '<input id="avBy" placeholder="Beslutad av" size="14" value="' + esc(by) + '">' +
      '<button class="act" id="avBtn">Lägg avdrag</button></div><div class="msg" id="avMsg"></div></div>';
    html += '<div class="card"><h2>Beslutslogg</h2><table><tr><th>Tid</th><th>Bidrag</th><th class=num>Avdrag</th><th>Motivering</th><th>Beslutad av</th><th></th></tr>' +
      list.map(function (a) {
        var label = a.team ? esc(a.team) + " · " + esc(a.gren || "?") : esc(a.lagkod);
        var amount = a.points > 0 ? "−" + fmt2.format(a.points) + " p" : Math.round(a.pct * 100) + " %";
        return "<tr" + (a.revoked_at ? ' style="opacity:.5"' : "") + "><td>" + esc(svTid(a.created_at, "dhm")) + "</td><td>" + label +
          "</td><td class=num>" + amount + "</td><td>" + esc(a.reason) + "</td><td>" + esc(a.decided_by || "") + "</td><td>" +
          (a.revoked_at ? "återkallat" : '<button class="sec danger" data-rev="' + a.id + '">Återkalla</button>') + "</td></tr>";
      }).join("") + "</table></div>";
    main.innerHTML = html;
    comboInit("avLagkod", assignments.map(function (a) {
      return { value: a.lagkod, label: a.team + " · " + a.gren + " (" + a.lagkod + ")" };
    }));
    var avKind = document.getElementById("avKind");
    avKind.addEventListener("change", function () {
      document.getElementById("avValue").placeholder = avKind.value === "points" ? "poäng" : "%";
    });
    document.getElementById("avBtn").addEventListener("click", function () {
      var lagkod = comboValue("avLagkod");
      var value = Number(document.getElementById("avValue").value);
      var reason = document.getElementById("avReason").value.trim();
      var points = avKind.value === "points";
      if (!lagkod || !reason) { msg("avMsg", "err", "Bidrag och motivering krävs."); return; }
      if (!(value > 0) || (!points && value > 100)) {
        msg("avMsg", "err", points ? "Ange ett poängavdrag större än 0." : "Ange en procentsats mellan 1 och 100.");
        return;
      }
      localStorage.setItem("adminNamn", document.getElementById("avBy").value.trim());
      api("/admin/avdrag", { method: "POST", body: {
        lagkod: lagkod,
        pct: points ? 0 : value / 100,
        points: points ? value : 0,
        reason: reason,
        decidedBy: document.getElementById("avBy").value.trim(),
      } }).then(function (r2) {
        if (!r2.data.ok) { msg("avMsg", "err", r2.data.message || "Kunde inte lägga avdraget."); return; }
        flash("ok", "Avdraget är registrerat och loggat.");
        renderAvdrag(main);
      });
    });
    main.querySelectorAll("[data-rev]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (!confirm("Återkalla avdraget?")) return;
        api("/admin/avdrag/" + b.getAttribute("data-rev") + "/revoke", { method: "POST", body: {} }).then(function (r2) {
          if (!r2.data.ok) { msg("avMsg", "err", r2.data.message || "Kunde inte återkalla avdraget."); return; }
          flash("ok", "Avdraget är återkallat.");
          renderAvdrag(main);
        });
      });
    });
  });
}

// ---------- Resultat ----------
function renderResultat(main) {
  function load(bg) {
    return Promise.all([api("/admin/results"), api("/admin/settings")]).then(function (rs) {
      if (!liveChanged(bg, [rs[0].data, rs[1].data])) return;
      var d = rs[0].data;
      var settings = rs[1].data.settings;
      var open = settings.reveal === "open";
      var CRIT = { smak: "Smak", textur: "Textur", utseende: "Utseende", kreativitet: "Kreativitet" };
      function badge(row) {
        if (row.unresolvedTie) return ' <span class="badge warn">delad – lottning!</span>';
        if (row.tieBreakUsed) return ' <span class="badge">skiljeregel: ' + esc(CRIT[row.tieBreakUsed] || row.tieBreakUsed) + "</span>";
        return "";
      }
      var html = '<div class="card"><div class="row" style="justify-content:space-between">' +
        "<div><h2 style='margin-bottom:2px'>Resultat</h2><span class='muted'>Metod: " + (d.method === "adjusted" ? "stränghetsjusterad" : "rå poäng") +
        " · dämpning K=" + d.dampingK + " · " + d.voteCount + " röster</span></div>" +
        '<button class="' + (open ? "sec danger" : "act") + '" id="revealBtn">' + (open ? "Dölj publika resultat" : "Publicera resultat publikt") + "</button></div></div>";

      if (d.totals.length) {
        var totalGrenar = d.grenar.filter(function (g) { return g.inTotal; });
        html += '<div class="card"><h2>Totalpoäng</h2><table><tr><th>#</th><th>Lag</th>' +
          totalGrenar.map(function (g) { return '<th class=num>' + esc(g.name) + "</th>"; }).join("") +
          "<th class=num>Totalt</th></tr>" +
          d.totals.map(function (t, i) {
            return "<tr><td>" + (i + 1) + "</td><td>" + esc(t.team) + badge(t) + "</td>" +
              totalGrenar.map(function (g) {
                var v = t.perGren[g.name];
                return "<td class=num>" + (v === undefined ? '<span class="muted">–</span>' : fmt2.format(v)) + "</td>";
              }).join("") +
              "<td class=num><b>" + fmt2.format(t.total) + "</b></td></tr>";
          }).join("") + "</table>" +
          '<p class="muted" style="margin-top:8px">Grenpoängen på varje rad är samma slutpoäng som i grentabellerna nedan. “–” betyder att laget saknar bidrag i grenen.</p></div>';
      }
      d.grenar.forEach(function (g) {
        var list = d.standings[g.name] || [];
        if (!list.length) return;
        html += '<div class="card"><h2>' + esc(g.name) + (g.inTotal ? "" : ' <span class="badge">utanför totalen</span>') + "</h2>" +
          "<table><tr><th>#</th><th>Lag</th><th>Kod</th><th class=num>Röster</th><th class=num>Rå</th><th class=num>Justerad</th><th class=num>Avdrag</th><th class=num>Slutpoäng</th></tr>" +
          list.map(function (e, i) {
            var deductions = [];
            if (e.factor < 1) deductions.push("−" + Math.round((1 - e.factor) * 100) + " %");
            if (e.deduction > 0) deductions.push("−" + fmt2.format(e.deduction) + " p");
            return "<tr><td>" + (i + 1) + "</td><td>" + esc(e.team) + badge(e) + "</td><td class=muted>" + esc(e.lagkod) + "</td><td class=num>" + e.n +
              "</td><td class=num>" + fmt2.format(e.raw) + "</td><td class=num>" + fmt2.format(e.adjusted) +
              "</td><td class=num>" + deductions.join(" ") +
              "</td><td class=num><b>" + fmt2.format(e.final) + "</b></td></tr>";
          }).join("") + "</table></div>";
      });

      html += '<div class="card"><h2>Domarnas stränghet <span class="badge">live</span></h2>' +
        '<p class="muted">Negativt = strängare än kollegorna, positivt = generösare. Dämpad skattning (K=' + d.dampingK + ").</p>" +
        "<table><tr><th>Domare</th><th class=num>Röster</th><th class=num>Stränghet</th></tr>" +
        d.severities.map(function (s) {
          var cls = s.severity < 0 ? "sev-neg" : "sev-pos";
          return "<tr><td>" + esc(s.judge) + "</td><td class=num>" + s.n + '</td><td class="num ' + cls + '">' +
            (s.severity >= 0 ? "+" : "") + fmt2.format(s.severity) + "</td></tr>";
        }).join("") + "</table></div>";

      main.innerHTML = html;
      document.getElementById("revealBtn").addEventListener("click", function () {
        var next = open ? "hidden" : "open";
        if (!confirm(next === "open" ? "Publicera resultaten på den publika sidan?" : "Dölj resultaten från den publika sidan?")) return;
        api("/admin/settings", { method: "PATCH", body: { reveal: next } }).then(load);
      });
    });
  }
  liveStart(load);
}

// ---------- Inställningar ----------
function renderInstallningar(main) {
  Promise.all([api("/admin/settings"), api("/admin/criteria"), api("/admin/grenar")]).then(function (rs) {
    var s = rs[0].data.settings;
    var criteria = rs[1].data.criteria;
    var grenar = rs[2].data.grenar;
    var wsum = criteria.filter(function (c) { return c.active; }).reduce(function (a, c) { return a + c.weight; }, 0);
    var html = '<div class="card"><h2>Tävlingsinställningar</h2><table>' +
      '<tr><td>Eventnamn</td><td><input id="sName" value="' + esc(s.event_name) + '" size="30"></td></tr>' +
      '<tr><td>Placeringsmetod</td><td><select id="sMethod"><option value="adjusted"' + (s.placement_method === "adjusted" ? " selected" : "") + ">Stränghetsjusterad (Variant A)</option><option value=\"raw\"" + (s.placement_method === "raw" ? " selected" : "") + ">Rå poäng (Variant B)</option></select></td></tr>" +
      '<tr><td>Publika resultat</td><td><select id="sReveal"><option value="hidden"' + (s.reveal === "hidden" ? " selected" : "") + ">Dolda</option><option value=\"open\"" + (s.reveal === "open" ? " selected" : "") + ">Öppna</option></select></td></tr>" +
      '<tr><td>Dämpning K</td><td><input id="sDamp" type="number" min="0" value="' + esc(s.damping_k) + '" style="width:80px"></td></tr>' +
      '<tr><td>Reservformulär (URL)</td><td><input id="sBackup" value="' + esc(s.backup_form_url) + '" size="40" placeholder="https://… ({lagkod}/{kortid} ersätts)"></td></tr>' +
      '</table><div class="row" style="margin-top:10px"><button class="act" id="sSave">Spara</button></div><div class="msg" id="sMsg"></div></div>';

    html += '<div class="card"><h2>Kriterier <span class="badge">viktsumma: ' + wsum.toFixed(2) + (Math.abs(wsum - 1) > 0.001 ? ' ⚠ bör vara 1,00' : "") + "</span></h2>" +
      "<table><tr><th>Nyckel</th><th>Etikett</th><th class=num>Vikt</th><th>Aktiv</th><th></th></tr>" +
      criteria.map(function (c) {
        return '<tr data-cid="' + c.id + '"><td class=muted>' + esc(c.key) + '</td><td><input class="cLabel" value="' + esc(c.label) + '" size="20"></td>' +
          '<td class=num><input class="cWeight" type="number" step="0.01" min="0" value="' + c.weight + '" style="width:80px"></td>' +
          '<td><input class="cActive" type="checkbox"' + (c.active ? " checked" : "") + "></td>" +
          '<td><button class="sec cSave">Spara</button></td></tr>';
      }).join("") + "</table>" +
      '<div class="row" style="margin-top:10px"><input id="cNewKey" placeholder="nyckel (t.ex. smak)" size="14"><input id="cNewLabel" placeholder="Etikett" size="18">' +
      '<input id="cNewWeight" type="number" step="0.01" min="0" placeholder="vikt" style="width:80px"><button class="sec" id="cAdd">+ Nytt kriterium</button></div>' +
      '<p class="muted" style="margin-top:6px">OBS: ändra inte kriterier efter att röstningen startat.</p><div class="msg" id="cMsg"></div></div>';

    html += '<div class="card"><h2>Grenar</h2><table><tr><th>Namn</th><th>I totalen</th><th>Aktiv</th><th></th></tr>' +
      grenar.map(function (g) {
        return '<tr data-gid="' + g.id + '"><td><input class="gName" value="' + esc(g.name) + '" size="20"></td>' +
          '<td><input class="gTotal" type="checkbox"' + (g.in_total ? " checked" : "") + "></td>" +
          '<td><input class="gActive" type="checkbox"' + (g.active ? " checked" : "") + "></td>" +
          '<td><button class="sec gSave">Spara</button></td></tr>';
      }).join("") + "</table>" +
      '<div class="row" style="margin-top:10px"><input id="gNewName" placeholder="Ny gren …" size="20"><label><input type="checkbox" id="gNewTotal" checked> ingår i totalen</label>' +
      '<button class="sec" id="gAdd">+ Ny gren</button></div><div class="msg" id="gMsg"></div></div>';

    main.innerHTML = html;

    document.getElementById("sSave").addEventListener("click", function () {
      api("/admin/settings", { method: "PATCH", body: {
        event_name: document.getElementById("sName").value,
        placement_method: document.getElementById("sMethod").value,
        reveal: document.getElementById("sReveal").value,
        damping_k: String(document.getElementById("sDamp").value),
        backup_form_url: document.getElementById("sBackup").value.trim(),
      } }).then(function (r2) {
        if (r2.data.ok) msg("sMsg", "ok", "Sparat."); else msg("sMsg", "err", r2.data.message);
      });
    });
    main.querySelectorAll(".cSave").forEach(function (b) {
      b.addEventListener("click", function () {
        var tr = b.closest("tr");
        api("/admin/criteria/" + tr.getAttribute("data-cid"), { method: "PATCH", body: {
          label: tr.querySelector(".cLabel").value,
          weight: Number(tr.querySelector(".cWeight").value),
          active: tr.querySelector(".cActive").checked,
        } }).then(function (r2) {
          if (!r2.data.ok) { msg("cMsg", "err", r2.data.message || "Kunde inte spara kriteriet."); return; }
          flash("ok", "Kriteriet sparat.");
          renderInstallningar(main);
        });
      });
    });
    document.getElementById("cAdd").addEventListener("click", function () {
      api("/admin/criteria", { method: "POST", body: {
        key: document.getElementById("cNewKey").value,
        label: document.getElementById("cNewLabel").value,
        weight: Number(document.getElementById("cNewWeight").value),
      } }).then(function (r2) {
        if (r2.status !== 201) { msg("cMsg", "err", r2.data.message || "Kunde inte skapa kriteriet."); return; }
        flash("ok", "Kriteriet tillagt.");
        renderInstallningar(main);
      });
    });
    main.querySelectorAll(".gSave").forEach(function (b) {
      b.addEventListener("click", function () {
        var tr = b.closest("tr");
        api("/admin/grenar/" + tr.getAttribute("data-gid"), { method: "PATCH", body: {
          name: tr.querySelector(".gName").value,
          inTotal: tr.querySelector(".gTotal").checked,
          active: tr.querySelector(".gActive").checked,
        } }).then(function (r2) {
          if (!r2.data.ok) { msg("gMsg", "err", r2.data.message || "Kunde inte spara grenen."); return; }
          flash("ok", "Grenen sparad.");
          renderInstallningar(main);
        });
      });
    });
    document.getElementById("gAdd").addEventListener("click", function () {
      api("/admin/grenar", { method: "POST", body: {
        name: document.getElementById("gNewName").value,
        inTotal: document.getElementById("gNewTotal").checked,
      } }).then(function (r2) {
        if (r2.status !== 201) { msg("gMsg", "err", r2.data.message || "Kunde inte skapa grenen."); return; }
        flash("ok", "Grenen tillagd.");
        renderInstallningar(main);
      });
    });
  });
}

// ---------- Data (import/export/logg) ----------
function renderData(main) {
  var html = '<div class="card"><h2>Importera kortregister</h2>' +
    '<p class="muted">Klistra in generatorns CSV (lagkod;url;bild) eller rader med kortid;lagkod. Dubbletter hoppas över.</p>' +
    '<textarea id="impText" placeholder="SODG;https://…?lagkod=SODG&kortid=…;/bild.png"></textarea>' +
    '<div class="row" style="margin-top:8px"><input type="file" id="impFile" accept=".csv,.txt"><button class="act" id="impBtn">Importera</button></div>' +
    '<div class="msg" id="impMsg"></div></div>' +
    '<div class="card"><h2>Export</h2><div class="row">' +
    '<button class="sec" id="expBtn">⬇ Ladda ner alla röster (CSV)</button>' +
    '<span class="muted">Ta en export då och då under dagen som säkerhetskopia.</span></div></div>' +
    '<div class="card"><h2>Adminlogg</h2><div id="logBox" class="muted">Laddar …</div></div>';
  main.innerHTML = html;

  document.getElementById("impFile").addEventListener("change", function (e) {
    var f = e.target.files[0];
    if (!f) return;
    f.text().then(function (t) { document.getElementById("impText").value = t; });
  });
  document.getElementById("impBtn").addEventListener("click", function () {
    var text = document.getElementById("impText").value;
    if (!text.trim()) return;
    api("/admin/cards/import", { method: "POST", body: text, headers: { "content-type": "text/plain" } }).then(function (r) {
      if (r.data.ok) msg("impMsg", "ok", r.data.imported + " kort importerade, " + r.data.skipped + " fanns redan, " + r.data.badLines.length + " rader kunde inte tolkas.");
      else msg("impMsg", "err", "Importen misslyckades.");
    });
  });
  document.getElementById("expBtn").addEventListener("click", function () {
    fetch("/api/admin/export.csv", { headers: { authorization: "Bearer " + token } })
      .then(function (r) { return r.blob(); })
      .then(function (blob) {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "roster-" + svTid(new Date().toISOString().slice(0, 19).replace("T", " ")).replace(" ", "T").replaceAll(":", "") + ".csv";
        a.click();
        URL.revokeObjectURL(a.href);
      });
  });
  api("/admin/log").then(function (r) {
    document.getElementById("logBox").innerHTML = "<table><tr><th>Tid</th><th>Händelse</th><th>Detalj</th></tr>" +
      r.data.log.map(function (l) {
        return "<tr><td>" + esc(svTid(l.at, "dhms")) + "</td><td>" + esc(l.action) + "</td><td class=muted>" + esc(l.detail || "") + "</td></tr>";
      }).join("") + "</table>";
  });
}

var RENDER = {
  oversikt: renderOversikt, tilldela: renderTilldela, papper: renderPapper, rostkort: renderRostkort, lag: renderLag,
  domare: renderDomare, avdrag: renderAvdrag, resultat: renderResultat, installningar: renderInstallningar, data: renderData,
};

if (!RENDER[currentView]) { currentView = "oversikt"; currentQuery = ""; }
if (token) {
  api("/admin/ping").then(function () { shell(); go(currentView, currentQuery, true); }).catch(function () { /* showLogin körs av api() */ });
} else {
  showLogin();
}
})();
</script>
