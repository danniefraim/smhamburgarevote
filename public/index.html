<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141110">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍔</text></svg>">
<title>Rösta – SM i Hamburgare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#141110; --panel:#1C1713; --panel2:#241E18; --line:#2A231C; --line2:#352C22;
    --ink:#F2EAD9; --muted:#A08A6A; --dim:#7A6A55; --faint:#5C4F3E;
    --amber:#FFB03A; --amber-ink:#1A140D;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.4;
  }
  ::selection { background: rgba(255,176,58,.35); }

  .mast {
    padding: calc(14px + env(safe-area-inset-top)) 18px 14px;
    border-bottom: 1px solid var(--line);
  }
  .mast .inner { max-width: 480px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
  .mast img.logo { width: 48px; height: auto; flex: none; }
  .kicker {
    font-size: .64rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted);
  }
  .mast h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -.01em; line-height: 1.15; }

  .wrap { max-width: 480px; margin: 0 auto; padding: 0 14px 30px; }

  .prog { display: flex; align-items: center; gap: 10px; padding: 12px 4px 0; }
  .prog .bar { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .prog .bar div { height: 100%; width: 0%; background: var(--amber); transition: width .2s ease; }
  .prog span { font-size: .69rem; font-weight: 600; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }

  .card { background: var(--panel); border-radius: 16px; padding: 14px; margin-top: 14px; }
  label.field {
    display: block; font-size: .64rem; font-weight: 600; letter-spacing: .18em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 7px;
  }
  input[type=text], textarea {
    width: 100%; padding: 11px 13px; border: 1px solid #3A3128; border-radius: 10px;
    font-size: 1.02rem; background: #1F1A15; color: var(--ink); font-family: inherit;
  }
  input[type=text]::placeholder, textarea::placeholder { color: var(--faint); }
  input[type=text]:focus-visible, textarea:focus-visible, button:focus-visible {
    outline: 3px solid rgba(255,176,58,.45); outline-offset: 1px;
  }
  textarea { min-height: 64px; resize: vertical; }
  .hint { color: var(--dim); font-size: .8rem; margin-top: 7px; }

  .crit { margin-top: 14px; }
  .crit:first-child { margin-top: 0; }
  .crit-label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
  .crit-label .name { font-weight: 700; font-size: .95rem; }
  .crit-label .val {
    min-width: 30px; text-align: center; font-weight: 700; font-size: .9rem;
    color: var(--amber-ink); background: var(--amber); border-radius: 7px; padding: 1px 9px;
    font-variant-numeric: tabular-nums;
  }
  .crit-label .val.empty { color: var(--faint); background: transparent; }
  .btns { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; }
  .btns button {
    padding: 11px 0; border: 1px solid var(--line2); background: var(--panel2); border-radius: 7px;
    font-size: .82rem; font-weight: 500; color: #CBBBA0; font-family: inherit;
    transition: transform .08s ease, background-color .12s ease, border-color .12s ease;
  }
  .btns button:active { transform: scale(.92); }
  .btns button.sel {
    background: var(--amber); border-color: var(--amber); color: var(--amber-ink); font-weight: 700;
  }

  .actionbar {
    position: sticky; bottom: 0; margin: 16px -14px 0; padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
    background: rgba(20,17,16,.92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line);
  }
  .actionbar .hint { text-align: center; margin: 0 0 8px; font-size: .78rem; color: var(--muted); }
  .actionbar .hint.ready { color: var(--amber); font-weight: 600; }
  .submit {
    width: 100%; padding: 15px; font-size: 1.05rem; font-weight: 700; font-family: inherit;
    color: var(--amber-ink); background: var(--amber); border: 0; border-radius: 12px;
    transition: transform .08s ease, opacity .15s ease;
  }
  .submit:not(:disabled):active { transform: scale(.98); }
  .submit:disabled { opacity: .45; }

  .status { text-align: center; padding: 34px 20px 30px; margin-top: 14px; border-radius: 20px; background: var(--panel); }
  .status .big { font-size: 3.2rem; line-height: 1; }
  .status h2 { margin: 14px 0 8px; font-size: 1.25rem; letter-spacing: -.01em; font-weight: 700; }
  .status p { color: var(--muted); max-width: 34ch; margin: 0 auto; }
  .status.dark { background: var(--panel); border: 1px solid rgba(255,176,58,.35); }
  .status.dark img.logo { width: 64px; margin-bottom: 14px; }

  .error-box {
    background: #2E1B12; border: 1px solid #5C3A28; color: #F0B9A2; border-radius: 12px;
    padding: 12px 14px; margin-top: 12px; font-size: .95rem; display: none;
  }
  .backup { margin-top: 10px; display: none; }
  .backup a { color: var(--amber); font-weight: 700; }

  footer { text-align: center; color: var(--faint); font-size: .72rem; padding: 18px 24px 8px; }
</style>
</head>
<body>
<header class="mast"><div class="inner">
  <img class="logo" src="/logo.svg" alt="SM i Burgare">
  <div>
    <div class="kicker" id="cardInfo">Domarröst</div>
    <h1 id="eventName">SM i Hamburgare</h1>
  </div>
</div></header>

<div class="wrap">
  <div id="view"></div>
  <footer>Vid tekniska problem: fyll i pappersröstkortet och lämna in det.</footer>
</div>

<script>
(function () {
  "use strict";
  var qs = new URLSearchParams(location.search);
  var kortid = (qs.get("kortid") || "").trim();
  var lagkod = (qs.get("lagkod") || "").trim().toUpperCase();
  var view = document.getElementById("view");
  var config = null;
  var state = { scores: {}, submitting: false };
  var DUPLICATE_TEXT =
    "Rösten som registrerades först gäller. Är det fel: fyll i pappersröstkortet och se till att det kommer till " +
    "huvuddomarna, så rättas det till.";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function statusScreen(kind, icon, title, text, extraHtml) {
    view.innerHTML =
      '<div class="status ' + kind + '">' +
      (kind === "dark" ? '<img class="logo" src="/logo.svg" alt="">' : "") +
      '<div class="big">' + icon + '</div><h2>' + esc(title) + '</h2><p>' + esc(text) + '</p>' +
      (extraHtml || "") + '</div>';
  }

  function backupHtml() {
    if (!config || !config.backupFormUrl) return "";
    var url = config.backupFormUrl.replace("{lagkod}", encodeURIComponent(lagkod)).replace("{kortid}", encodeURIComponent(kortid));
    return '<p class="backup" style="display:block"><a href="' + esc(url) + '">Använd reservformuläret i stället →</a></p>';
  }

  function renderForm() {
    var judge = localStorage.getItem("domarnamn") || "";
    var html = '<form id="voteForm">';
    html += '<div class="prog"><div class="bar"><div id="progFill"></div></div><span id="progLabel"></span></div>';
    html += '<div class="card"><label class="field" for="judge">Ditt namn (domare)</label>';
    html += '<input type="text" id="judge" list="judgeList" autocomplete="off" required maxlength="60" value="' + esc(judge) + '" placeholder="Skriv ditt namn">';
    html += '<datalist id="judgeList">' + config.judges.map(function (j) { return '<option value="' + esc(j) + '">'; }).join("") + '</datalist>';
    html += '<div class="hint">Använd samma namn hela dagen.</div></div>';
    html += '<div class="card">';
    config.criteria.forEach(function (c) {
      html += '<div class="crit"><div class="crit-label"><span class="name">' + esc(c.label) + '</span><span class="val empty" id="val-' + esc(c.key) + '">–</span></div>';
      html += '<div class="btns" data-key="' + esc(c.key) + '">';
      for (var i = 0; i <= 10; i++) html += '<button type="button" data-v="' + i + '">' + i + "</button>";
      html += "</div></div>";
    });
    html += '</div>';
    html += '<div class="card"><label class="field" for="comment">Kommentar till laget (frivilligt)</label>';
    html += '<textarea id="comment" maxlength="2000" placeholder="Vad var bra? Vad kan bli bättre?"></textarea></div>';
    html += '<div class="error-box" id="errorBox"></div>';
    html += '<div class="actionbar"><div class="hint" id="submitHint"></div>';
    html += '<button class="submit" id="submitBtn" type="submit" disabled>Skicka min röst</button></div>';
    html += "</form>";
    view.innerHTML = html;

    view.querySelectorAll(".btns").forEach(function (row) {
      row.addEventListener("click", function (ev) {
        var b = ev.target.closest("button[data-v]");
        if (!b) return;
        var key = row.getAttribute("data-key");
        state.scores[key] = Number(b.getAttribute("data-v"));
        row.querySelectorAll("button").forEach(function (x) { x.classList.toggle("sel", x === b); });
        var val = document.getElementById("val-" + key);
        val.textContent = b.getAttribute("data-v");
        val.classList.remove("empty");
        updateSubmit();
      });
    });
    document.getElementById("judge").addEventListener("input", updateSubmit);
    document.getElementById("voteForm").addEventListener("submit", onSubmit);
    updateSubmit();
  }

  function missingCount() {
    return config.criteria.filter(function (c) { return typeof state.scores[c.key] !== "number"; }).length;
  }

  function complete() {
    var judge = document.getElementById("judge");
    if (!judge || !judge.value.trim()) return false;
    return missingCount() === 0;
  }

  function updateSubmit() {
    var btn = document.getElementById("submitBtn");
    var hint = document.getElementById("submitHint");
    if (!btn) return;
    btn.disabled = !complete() || state.submitting;
    var total = config.criteria.length;
    var done = total - missingCount();
    var fill = document.getElementById("progFill");
    var progLabel = document.getElementById("progLabel");
    if (fill) fill.style.width = Math.round((done / total) * 100) + "%";
    if (progLabel) progLabel.textContent = done + "/" + total + " kriterier";
    if (!hint) return;
    var judge = document.getElementById("judge");
    if (!judge.value.trim()) {
      hint.textContent = "Fyll i ditt namn högst upp.";
      hint.className = "hint";
    } else {
      var left = missingCount();
      if (left > 0) {
        hint.textContent = left === 1 ? "1 kriterium kvar att poängsätta." : left + " kriterier kvar att poängsätta.";
        hint.className = "hint";
      } else {
        hint.textContent = "Allt ifyllt — skicka när du är nöjd!";
        hint.className = "hint ready";
      }
    }
  }

  function showError(msg, withBackup) {
    var box = document.getElementById("errorBox");
    if (!box) return;
    box.style.display = "block";
    box.innerHTML = esc(msg) + (withBackup ? backupHtml() : "");
    box.scrollIntoView({ block: "nearest" });
  }

  function onSubmit(ev) {
    ev.preventDefault();
    if (!complete() || state.submitting) return;
    state.submitting = true;
    updateSubmit();
    var judge = document.getElementById("judge").value.trim();
    localStorage.setItem("domarnamn", judge);
    var payload = {
      kortid: kortid,
      lagkod: lagkod,
      judge: judge,
      scores: state.scores,
      comment: document.getElementById("comment").value,
    };
    fetch("/api/vote", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(payload),
    })
      .then(function (res) { return res.json().then(function (data) { return { res: res, data: data }; }); })
      .then(function (r) {
        if (r.data.ok && r.data.status === "accepted") {
          statusScreen("dark", "✅", "Tack, din röst är registrerad!", "Du kan lämna tillbaka kortet eller slänga det.");
          window.scrollTo(0, 0);
        } else if (r.data.ok && r.data.status === "duplicate") {
          statusScreen("light", "ℹ️", "Kortet var redan registrerat", DUPLICATE_TEXT);
        } else {
          state.submitting = false;
          updateSubmit();
          showError(r.data.message || "Något gick fel. Försök igen.", false);
        }
      })
      .catch(function () {
        state.submitting = false;
        updateSubmit();
        showError("Ingen kontakt med servern. Kontrollera uppkopplingen och försök igen — eller fyll i papperskortet.", true);
      });
  }

  if (!kortid) {
    statusScreen("light", "📷", "Skanna QR-koden på ditt röstkort", "Den här sidan öppnas via QR-koden på röstkortet. Om skanningen inte fungerar: fyll i kortet med penna och lämna in det.");
  } else {
    Promise.all([
      fetch("/api/config").then(function (r) { return r.json(); }),
      fetch("/api/card/" + encodeURIComponent(kortid)).then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); }),
    ])
      .then(function (results) {
        config = results[0];
        document.getElementById("eventName").textContent = config.eventName;
        var card = results[1];
        if (card.status === 404) {
          statusScreen("light", "❓", "Kortet kunde inte hittas", "QR-koden verkar inte höra till årets tävling. Fyll i papperskortet och kontakta huvuddomaren.");
          return;
        }
        lagkod = card.data.lagkod;
        document.getElementById("cardInfo").textContent = "Kort " + kortid.slice(0, 8) + " · grupp " + lagkod;
        if (card.data.used) {
          statusScreen("light", "ℹ️", "Det här kortet är redan registrerat", DUPLICATE_TEXT);
          return;
        }
        renderForm();
      })
      .catch(function () {
        statusScreen("light", "📡", "Ingen kontakt med servern", "Kontrollera uppkopplingen och ladda om sidan — eller fyll i papperskortet och lämna in det.");
      });
  }
})();
</script>
</body>
</html>
