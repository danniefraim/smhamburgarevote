<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141110">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍔</text></svg>">
<title>Resultat – SM i Hamburgare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#141110; --panel:#1C1713; --panel2:#241E18; --line:#2A231C; --line2:#352C22;
    --ink:#F2EAD9; --muted:#A08A6A; --dim:#7A6A55; --faint:#5C4F3E;
    --amber:#FFB03A; --amber-ink:#1A140D;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.4;
  }
  ::selection { background: rgba(255,176,58,.35); }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 22px 20px 60px; }

  header.mast { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
  .mast img.logo { width: 64px; height: auto; flex: none; }
  .kicker {
    font-size: .66rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase;
    color: var(--amber); display: flex; align-items: center; gap: 7px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  .mast h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -.01em; }
  .mast .sub { color: var(--muted); font-size: .85rem; margin-top: 2px; }

  .cols { display: grid; grid-template-columns: 1.2fr 1fr; gap: 28px; align-items: start; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }

  .board { margin-top: 6px; }
  .boardkicker {
    font-size: .69rem; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }
  .row {
    display: flex; align-items: center; gap: 14px; padding: 12px 4px;
    border-bottom: 1px solid var(--line);
  }
  .row .pl { width: 34px; font-size: 1.1rem; font-weight: 600; color: var(--dim); font-variant-numeric: tabular-nums; }
  .row .team { flex: 1; font-size: 1rem; font-weight: 500; }
  .row .n { font-size: .75rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  .row .score { font-size: 1.05rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .row.leader {
    background: #221B14; border: 1px solid rgba(255,176,58,.4); border-radius: 12px;
    padding: 13px 14px; margin-top: 8px;
  }
  .row.leader .pl { color: var(--amber); font-size: 1.35rem; font-weight: 700; }
  .row.leader .team { font-size: 1.06rem; font-weight: 600; }
  .row.leader .score { color: var(--amber); font-size: 1.25rem; font-weight: 700; }

  .badge {
    display: inline-block; font-size: .66rem; border: 1px solid var(--line2); color: var(--muted);
    border-radius: 99px; padding: 1px 8px; margin-left: 8px; vertical-align: 1px; font-weight: 500;
  }
  .waiting { text-align: center; padding: 52px 24px; margin-top: 14px; border-radius: 20px; background: var(--panel); }
  .waiting.dark { border: 1px solid rgba(255,176,58,.35); }
  .waiting.dark p { color: var(--muted); }
  .waiting img.logo { width: 74px; margin-bottom: 16px; }
  .waiting .big { font-size: 3.2rem; line-height: 1; }
  .waiting h2 { margin: 12px 0 6px; font-weight: 700; }
  .waiting p { color: var(--muted); max-width: 36ch; margin: 0 auto; }
  footer { text-align: center; color: var(--faint); font-size: .75rem; margin-top: 30px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <img class="logo" src="/logo.svg" alt="SM i Burgare">
    <div>
      <div class="kicker"><span class="dot"></span><span id="methodInfo">Resultat</span></div>
      <h1 id="eventName">SM i Hamburgare</h1>
      <div class="sub" id="subInfo"></div>
    </div>
  </header>
  <div id="content"><div class="waiting"><div class="big">🍔</div><p>Hämtar resultat …</p></div></div>
  <footer>Uppdateras automatiskt var 5:e sekund.</footer>
</div>

<script>
(function () {
  "use strict";
  var content = document.getElementById("content");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }
  var fmt = new Intl.NumberFormat("sv-SE", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var CRIT_NAMES = { smak: "Smak", textur: "Textur", utseende: "Utseende", kreativitet: "Kreativitet" };

  function badges(row) {
    var out = "";
    if (row.unresolvedTie) out += '<span class="badge">delad – lottning</span>';
    else if (row.tieBreakUsed) out += '<span class="badge">skiljeregel: ' + esc(CRIT_NAMES[row.tieBreakUsed] || row.tieBreakUsed) + "</span>";
    return out;
  }

  function pad(place) {
    return place < 10 ? "0" + place : String(place);
  }

  function render(data) {
    document.getElementById("eventName").textContent = data.eventName;
    if (data.hidden) {
      document.getElementById("methodInfo").textContent = "Resultat";
      document.getElementById("subInfo").textContent = "";
      content.innerHTML =
        '<div class="waiting dark"><img class="logo" src="/logo.svg" alt=""><div class="big">🤫</div>' +
        "<h2>Resultaten är inte publicerade ännu</h2><p>Håll ut — vinnarna presenteras vid prisutdelningen!</p></div>";
      return;
    }
    document.getElementById("methodInfo").textContent = "Live · uppdateras löpande";
    document.getElementById("subInfo").textContent =
      data.method === "adjusted" ? "Stränghetsjusterad poäng" : "Råpoäng";

    var left = "";
    if (data.totals.length > 0) {
      left += '<div class="board"><div class="boardkicker">Totalpoäng · ' +
        esc(data.grenar.filter(function (g) { return g.inTotal; }).map(function (g) { return g.name; }).join(" + ")) +
        "</div>";
      data.totals.forEach(function (t) {
        left += '<div class="row' + (t.place === 1 ? " leader" : "") + '"><span class="pl">' + pad(t.place) +
          '</span><span class="team">' + esc(t.team) + badges(t) + '</span><span class="score">' + fmt.format(t.total) + "</span></div>";
      });
      left += "</div>";
    }
    var right = "";
    data.grenar.forEach(function (g) {
      if (g.standings.length === 0) return;
      right += '<div class="board"><div class="boardkicker">Gren · ' + esc(g.name) + "</div>";
      g.standings.forEach(function (s) {
        right += '<div class="row"><span class="pl">' + pad(s.place) + '</span><span class="team">' + esc(s.team) + badges(s) +
          '</span><span class="n">' + s.n + ' röster</span><span class="score">' + fmt.format(s.final) + "</span></div>";
      });
      right += "</div>";
    });

    if (!left && !right) {
      content.innerHTML = '<div class="waiting"><div class="big">⏳</div><p>Inga resultat ännu.</p></div>';
      return;
    }
    if (!left) content.innerHTML = '<div class="cols"><div>' + right + "</div></div>";
    else content.innerHTML = '<div class="cols"><div>' + left + "</div><div>" + right + "</div></div>";
  }

  function tick() {
    fetch("/api/resultat")
      .then(function (r) { return r.json(); })
      .then(render)
      .catch(function () { /* behåll senaste vyn vid nätverksfel */ });
  }
  tick();
  setInterval(tick, 5000);
})();
</script>
</body>
</html>
